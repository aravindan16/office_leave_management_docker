version: "3.8"

services:
  wizzgeeks-leave-backend:
    build:
      context: ../office_leave_management_backend
      dockerfile: Dockerfile
    image: wizzgeeks-leave/backend
    ports:
      - "9051:9051"
    env_file:
      - ../office_leave_management_backend/.env
    networks:
      - shared-app-network

  wizzgeeks-leave-frontend:
    build:
      context: ../office_leave_management_frontend
      dockerfile: Dockerfile
    image: wizzgeeks-leave/frontend
    ports:
      - "9050:80"
    networks:
      - shared-app-network

networks:
  shared-app-network:
    external: true
